[project]
dependencies = [
  "keyring>=25.7.0",
  "poethepoet>=0.40.0",
]
description = "Free Open-source Rest Client"
name = "forc-project"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[tool.poe.tasks]
forc = "uv run src/forc/app/__main__.py"
qrc = "pyside6-rcc -o src/forc/app/qrc_resources.py resources/resources.qrc"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["tests", "test-apis"]

[tool.pyright]
# Stricter settings to catch missing .value or () on Variables
reportUnknownMemberType = "error"  # Complain when calling methods on Any

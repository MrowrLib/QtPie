[project]
dependencies = [
  "poethepoet>=0.40.0",
]
description = "Free Open-source Rest Client"
name = "forc-project"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[tool.poe.tasks]
forc = "uv run src/forc/app/__main__.py"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src", "tests", "test-apis"]

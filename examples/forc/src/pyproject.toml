[project]
dependencies = [
  "qtpie",
  "cattrs>=24.1.0",
  "ruamel.yaml>=0.18.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]
description = "Free Open-source Rest Client"
name = "forc"
requires-python = ">=3.13"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["forc"]

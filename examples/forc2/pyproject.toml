[project]
dependencies = [
  "keyring>=25.7.0",
  "poethepoet>=0.40.0",
]
description = "Free Open-source Rest Client (v2)"
name = "forc2-project"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[tool.poe.tasks]
forc2 = "uv run src/forc/app/__main__.py"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.pyright]
reportUnknownMemberType = "error"

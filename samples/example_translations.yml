# Example translations for QtPie
# Use with: @entrypoint(translations="samples/example_translations.yml", language="fr")

# Global translations (available to all widgets)
:global:
    # Simple translations
    Hello:
        en: Hello
        fr: Bonjour
        de: Hallo
        es: Hola

    Goodbye:
        en: Goodbye
        fr: Au revoir
        de: Auf Wiedersehen
        es: Adios

    # Common UI elements
    OK:
        en: OK
        fr: OK
        de: OK
        es: Aceptar

    Cancel:
        en: Cancel
        fr: Annuler
        de: Abbrechen
        es: Cancelar

    Save:
        en: Save
        fr: Enregistrer
        de: Speichern
        es: Guardar

    # Disambiguation example - same source text, different meanings
    "Open|menu":
        en: Open
        fr: Ouvrir
        de: Oeffnen
        es: Abrir

    "Open|status":
        en: Open
        fr: Ouvert
        de: Offen
        es: Abierto

    # Plurals - use %n for the count
    "%n file(s)":
        en:
            - "%n file"
            - "%n files"
        fr:
            - "%n fichier"
            - "%n fichiers"
        de:
            - "%n Datei"
            - "%n Dateien"
        es:
            - "%n archivo"
            - "%n archivos"

    "%n item(s) selected":
        en:
            - "%n item selected"
            - "%n items selected"
        fr:
            - "%n element selectionne"
            - "%n elements selectionnes"

    # Translator notes
    Submit:
        :note: Button for form submission
        en: Submit
        fr: Soumettre
        de: Absenden
        es: Enviar


site_name: QtPie
site_description: Declarative UI framework for Qt/PySide6
site_url: https://mrowrlib.github.io/QtPie

repo_name: MrowrLib/QtPie
repo_url: https://github.com/MrowrLib/QtPie

theme:
  name: material
  favicon: images/favicon.ico
  logo: images/QtPie%20256.png
  palette:
    - scheme: default
      primary: light blue
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: light blue
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Fira Code
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why QtPie?: why-qtpie.md
  - Install: install.md
  - Basics:
      - Widgets: basics/widgets.md
      - Layouts: basics/layouts.md
      - Signals: basics/signals.md
  - Reactive State:
      - Variables: state/variables.md
      - Bindings: state/bindings.md
      - Format Expressions: state/format-expressions.md
      - Property Bindings: state/property-bindings.md
      - Widget Bindings: state/widget-bindings.md
      - List Bindings: state/list-bindings.md
      - References: state/references.md
  - Data & Forms:
      - Records: data/records.md
      - Record Bindings: data/record-bindings.md
      - View Model: data/view-model.md
      - Repeaters: data/repeaters.md
      - Validation: data/validation.md
      - Dirty Tracking: data/dirty-tracking.md
  - Guides:
      - Entry Points: guides/entrypoint.md
      - App: guides/app.md
      - Windows & Menus: guides/windows-menus.md
      - Styling: guides/styling.md
      - Translations: guides/translations.md
  - Reference:
      - Observant Library: reference/observant.md
  - Qt Resources: qt-resources.md

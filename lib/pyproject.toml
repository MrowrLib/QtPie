[project]
dependencies = [
  "mrowrpurr-pyscss>=1.4.1",
  "pyyaml>=6.0.3",
  "qasync>=0.28.0",
  "qtpy>=2.4.3",
  "typer>=0.21.1",
]
description = "Add your description here"
name = "qtpie"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[project.optional-dependencies]
test = ["pytest", "pytest-qt"]

[project.scripts]
qtpie = "qtpie.cli.main:main"

[project.entry-points.pytest11]
qtpie = "qtpie.testing.plugin"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["qtpie", "observant"]
